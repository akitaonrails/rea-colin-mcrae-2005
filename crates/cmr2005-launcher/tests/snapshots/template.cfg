# Settings for CMR2005Launcher.exe (Colin McRae Rally 2005).
# Every key is also a command-line flag: resolution = 1920x1080 is
# --resolution 1920x1080.
# A key left commented out keeps the game's own value.

# Your installed game (the folder with cmr5.exe), or the folder with GOG's
# installer files (setup_colin2005.exe and its two .bin files). An installer
# is never run: the first Play unpacks the game from it once into the
# launcher's own folder (about 3.9 GB free space needed) and this setting
# then points there. The folder you choose is only read, never changed.
# Values: a folder or file.
#game =

# Sets the picture in one go: Original as the game shipped, Widescreen
# fitted to your screen, or Steam Deck (1280x720 at 60 fps). Options set
# after it win.
# Values: original, widescreen or steam_deck.
#look =

# The picture size. A 16:9 size shows the game's widescreen view; other
# shapes keep the 4:3 view. Original keeps the size set in the game.
# Values: WIDTHxHEIGHT or original.
#resolution = 1920x1080

# The most frames per second the game draws; 0 or off for no cap. 60 keeps
# the game's frame-rate-timed animations steady. Under Wine and Proton only.
# Values: 0 to 1000.
#fps_limit = 60

# Waits for the screen before showing each frame: no tearing, slightly more
# input delay. Under Wine and Proton only.
# Values: on or off.
#vsync =

# Lets the game offer its Advanced particles (dust, gravel and snow spray),
# which it otherwise allows only on 2004 Intel Hyper-Threading processors.
# On by default; turn them off here or in the game's Options, Graphics.
# Heavy snow on the Swedish stages can hide the road with them on.
# Values: on or off.
#advanced_particles =

# Show the game one wheel made from your wheel and pedals: auto when a wheel
# is plugged in as the game starts.
# Values: auto, on or off.
#wheel =

# The wheel to drive with, by its DirectInput instance GUID; empty picks
# one.
# Values: text.
#wheel_device =

# Separate pedals, by their DirectInput instance GUID; empty uses the
# calibrated pedals or the wheel's own.
# Values: text.
#wheel_pedals =

# How far you turn the wheel for full lock in the game. Full is the wheel's
# whole rotation.
# Values: 180, 270, 360, 540, 900 or full.
#wheel_lock =

# A small band in the centre that does nothing (percent), for a wheel that
# drifts.
# Values: 0 to 25.
#wheel_deadzone =

# 0 steers as much as you turn; up to 100 softens small turns near the
# centre.
# Values: 0 to 100.
#wheel_curve =

# For a throttle that reads backwards.
# Values: on or off.
#wheel_invert_throttle =

# For a brake that reads backwards.
# Values: on or off.
#wheel_invert_brake =

# How hard the wheel pushes back in the game (percent; 0 is off). Go lower
# on a direct-drive wheel.
# Values: 0 to 100.
#wheel_ffb =

# Only for a wheel that pulls the wrong way.
# Values: on or off.
#wheel_ffb_invert =

# Write rea_wheel.log next to the game, for bug reports.
# Values: on or off.
#wheel_log =

# Where the launcher keeps its own copy of the game and your saves. Empty: a
# folder beside launcher.log. It must be outside the game folder.
# Values: a folder or file.
#runtime =
