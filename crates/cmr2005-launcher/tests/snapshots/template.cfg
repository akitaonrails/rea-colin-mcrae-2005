# Settings for CMR2005Launcher.exe (Colin McRae Rally 2005).
# Every key is also a command-line flag: resolution = 1920x1080 is
# --resolution 1920x1080.
# A key left commented out keeps the game's own value.

# Your installed game (the folder with cmr5.exe), or the folder with GOG's
# installer files (setup_colin2005.exe and its two .bin files). An installer
# is never run: the first Play unpacks the game from it once into the
# launcher's own folder (about 3.9 GB free space needed) and this setting
# then points there. The folder you choose is only read, never changed.
# Values: a folder or file.
#game =

# Sets the picture in one go: Original as the game shipped, Widescreen
# fitted to your screen, or Steam Deck (1280x720 at 60 fps). Options set
# after it win.
# Values: original, widescreen or steam_deck.
#look =

# The picture size. A 16:9 size shows the game's widescreen view; other
# shapes keep the 4:3 view. Original keeps the size set in the game.
# Values: WIDTHxHEIGHT or original.
#resolution = 1920x1080

# The most frames per second the game draws; 0 or off for no cap. 60 keeps
# the game's frame-rate-timed animations steady. Under Wine and Proton only.
# Values: 0 to 1000.
#fps_limit = 60

# Waits for the screen before showing each frame: no tearing, slightly more
# input delay. Under Wine and Proton only.
# Values: on or off.
#vsync =

# Where the launcher keeps its own copy of the game and your saves. Empty: a
# folder beside launcher.log. It must be outside the game folder.
# Values: a folder or file.
#runtime =
