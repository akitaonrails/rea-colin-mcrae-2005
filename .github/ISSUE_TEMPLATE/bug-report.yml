name: Bug report
description: "CMR2005Launcher.exe does not run Colin McRae Rally 2005 as it should."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never attach cmr5.exe, DLLs, saves, media or any other
        game files. Remove usernames and personal paths from settings and logs.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Windows 11
        - Windows 10
        - Steam Deck (Game Mode)
        - Steam Deck (Desktop Mode)
        - Linux with Steam / Proton
        - Linux with the AppImage
        - Linux with Wine and cmr2005-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "CMR2005Launcher 0.1.0".
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of cmr5.exe
      description: |
        launcher.log names the game's edition, or the SHA-256 of a build it does not know.
        Windows: `certutil -hashfile cmr5.exe SHA256`. Linux: `sha256sum cmr5.exe`.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card, controller and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, Xbox-style pad, 2560x1440 at 144 Hz".
  - type: checkboxes
    id: worked
    attributes:
      label: What worked?
      description: Tick everything that worked, so we know how far the game got.
      options:
        - label: The settings window opened
        - label: The game started (intro or menus showed)
        - label: A full race or stage could be played
        - label: Gamepad (steering, pedals, buttons)
        - label: Sound and music
        - label: Alt+Tab and back
        - label: Quitting from the game's menu closed everything
        - label: Closing the window (or Alt+F4 while moving the mouse) closed everything
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look and anything you changed, or launcher.cfg without personal paths.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\CMR2005Launcher\launcher.log. Under Wine or Proton it is inside
        the prefix (cmr2005-play and the AppImage: ~/.local/share/cmr2005-launcher/prefix).
        Remove personal paths before posting.
      render: text
    validations:
      required: true
