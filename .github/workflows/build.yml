name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The shared rea-launcher-sdk CI: formatting, host tests, cargo audit and
  # deny, sdk/ drift, shell syntax and the Linux helper and packaging tests,
  # Windows-target clippy, the release build, the Windows-target tests under
  # Wine (headless), packaging and the package allowlist
  # (rea-launcher-sdk docs/playbooks/ci-and-releases.md).
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.8.2
    with:
      rust-target: i686-pc-windows-gnu
      wine-tests: true
      # The SDK's close hook and wheel layer DLLs (dependencies, not workspace
      # members), with their `dll` feature and the unwinding `dll` profile,
      # packaged into components/ by packaging/package.sh.
      extra-build: sh packaging/build-dlls.sh
      package-command: packaging/package.sh "dist/CMR2005Launcher-$REA_VERSION_NAME"
      package-dir: dist/CMR2005Launcher-*/
      package-allowlist: packaging/package.allow
      artifact-name: CMR2005Launcher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    # All three, even with attest: false (GitHub checks a called workflow's
    # permissions before any if:).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.8.2
    with:
      package: cmr2005-launcher
      artifact-pattern: CMR2005Launcher-*
